name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Check default features
        run: cargo +stable check --locked

      - name: Check minimal Send v3 features
        run: cargo +stable check --locked --no-default-features --features send3,crypto-openssl

      - name: Check optional ring backend
        run: cargo +stable check --locked --no-default-features --features send3,crypto-ring

      - name: Run tests
        run: cargo +stable test --locked
